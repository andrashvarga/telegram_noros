name: Build Noros portable (Windows x64)

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: noros-build
  cancel-in-progress: true

env:
  # Upstream Telegram Desktop commit that noros.patch was written against.
  UPSTREAM_REF: f985723b552b30fe1c17d377d57f44e61a15a8c4
  PREPARE_PATH: "Telegram/build/prepare/prepare.py"

jobs:
  windows:
    name: Windows x64 (portable exe)
    runs-on: windows-latest
    timeout-minutes: 350
    defaults:
      run:
        shell: cmd

    steps:
      - name: Check API credentials.
        shell: bash
        run: |
          if [ -z "${{ secrets.TDESKTOP_API_ID }}" ] || [ -z "${{ secrets.TDESKTOP_API_HASH }}" ]; then
            echo "Add repository secrets TDESKTOP_API_ID and TDESKTOP_API_HASH (from https://my.telegram.org/apps)."
            exit 1
          fi

      - name: Prepare directories.
        run: |
          mkdir %userprofile%\TBuild\Libraries
          mklink /d %GITHUB_WORKSPACE%\TBuild %userprofile%\TBuild
          echo TBUILD=%GITHUB_WORKSPACE%\TBuild>>%GITHUB_ENV%
          echo LibrariesPath=%GITHUB_WORKSPACE%\TBuild\Libraries\win64>>%GITHUB_ENV%
          echo REPO_NAME=tdesktop>>%GITHUB_ENV%

      - name: Clone upstream Telegram Desktop.
        uses: actions/checkout@v4
        with:
          repository: telegramdesktop/tdesktop
          ref: ${{ env.UPSTREAM_REF }}
          submodules: recursive
          path: ${{ env.TBUILD }}\tdesktop

      - name: Clone fork files.
        uses: actions/checkout@v4
        with:
          path: fork

      - name: Apply Noros patch and overlay.
        shell: bash
        run: |
          cd "$TBUILD/tdesktop"
          git apply --whitespace=nowarn "$GITHUB_WORKSPACE/fork/noros.patch"
          cp -rv "$GITHUB_WORKSPACE/fork/overlay/." .
          test -f Telegram/SourceFiles/noros/noros_brand.cpp
          test -f Telegram/Resources/noros/themes/riopay_glass.tdesktop-theme

      - name: First set up.
        shell: bash
        run: |
          DOCPATH=$TBUILD/$REPO_NAME/docs/building-win.md
          SDK="$(grep "SDK version" $DOCPATH | sed -r 's/.*\*\*(.*)\*\* SDK version.*/\1/')"
          echo "SDK=$SDK" >> $GITHUB_ENV
          sed -i '/CMAKE_${lang}_FLAGS_DEBUG_INIT/s/${_Zi}//' "$PROGRAMFILES"/CMake/share/cmake*/Modules/Platform/Windows-MSVC.cmake
          echo "$(sha256sum $TBUILD/$REPO_NAME/$PREPARE_PATH | awk '{ print $1 }')" >> CACHE_KEY.txt
          echo "$SDK" >> CACHE_KEY.txt
          echo "CACHE_KEY=$(sha256sum CACHE_KEY.txt | awk '{ print $1 }')" >> $GITHUB_ENV
          git config --global user.email "you@example.com"
          git config --global user.name "Sample"

      - uses: Eden-CI/msvc-dev-cmd@master
        name: Native Tools Command Prompt.
        with:
          arch: x64
          sdk: ${{ env.SDK }}
          toolset: "14.44"

      - name: Locate ATL (needed by breakpad).
        shell: bash
        run: |
          FOUND=$(find "/c/Program Files/Microsoft Visual Studio" "/c/Program Files (x86)/Microsoft Visual Studio" -iname atlbase.h 2>/dev/null | head -5)
          echo "::notice title=atl::${FOUND//$'\n'/|}"
          if [ -z "$FOUND" ]; then echo "::warning title=atl::atlbase.h not found anywhere"; exit 0; fi
          # Prefer the newest toolset.
          H=$(echo "$FOUND" | sort -V | tail -1)
          INC=$(dirname "$H"); ROOT=$(dirname "$INC")
          WININC=$(cygpath -w "$INC"); WINLIB=$(cygpath -w "$ROOT/lib/x64")
          echo "INCLUDE=$WININC;$INCLUDE" >> $GITHUB_ENV
          echo "LIB=$WINLIB;$LIB" >> $GITHUB_ENV
          echo "::notice title=atl-set::$WININC ; $WINLIB"

      - name: NuGet sources.
        run: |
          nuget sources Disable -Name "Microsoft Visual Studio Offline Packages"
          nuget sources Add -Source https://api.nuget.org/v3/index.json & exit 0

      - name: ThirdParty cache.
        uses: actions/cache@v4
        with:
          path: ${{ env.TBUILD }}\ThirdParty
          key: ${{ runner.OS }}-x64-third-party-${{ env.CACHE_KEY }}
          restore-keys: ${{ runner.OS }}-x64-third-party-

      - name: Libraries cache.
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.LibrariesPath }}\*
            !${{ env.LibrariesPath }}\cache_keys
            !${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\*
            !${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: ${{ runner.OS }}-x64-libs-v3-${{ env.CACHE_KEY }}
          restore-keys: |
            ${{ runner.OS }}-x64-libs-v3-
            ${{ runner.OS }}-x64-libs-v2-

      - name: Qt cache.
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: ${{ runner.OS }}-x64-qt-v3-${{ env.CACHE_KEY }}
          restore-keys: |
            ${{ runner.OS }}-x64-qt-v3-
            ${{ runner.OS }}-x64-qt-

      - name: Libraries.
        id: libs
        continue-on-error: true
        run: |
          %TBUILD%\%REPO_NAME%\Telegram\build\prepare\win.bat silent > %GITHUB_WORKSPACE%\libs.log 2>&1
          if errorlevel 1 exit /b 1

      - name: Report library errors (annotations).
        if: steps.libs.outcome == 'failure'
        shell: bash
        run: |
          LOG="$GITHUB_WORKSPACE/libs.log"
          echo "log lines: $(wc -l < "$LOG")"
          echo "::error title=libs-tail::$(tail -n 30 "$LOG" | cut -c1-220 | head -c 3500 | tr '\n' '|')"
          echo "::error title=libs-errors::$(grep -n -E "error C[0-9]+|fatal error|FAILED:|CMake Error|Error:|exit code|ninja: build stopped|No space left|is not recognized|ModuleNotFound|Traceback" "$LOG" | grep -v "Structured output" | tail -n 8 | cut -c1-300 | head -c 3500 | tr '\n' '|')"

      - name: Free up some disk space.
        if: steps.libs.outcome == 'success'
        shell: bash
        run: find $LibrariesPath '(' '(' ! '(' -name '*.lib' -o -name '*.a' -o -name '*.exe' -o -name '*.h' -o -name '*.hpp' -o -name '*.inc' -o -name '*.cmake' -o -name '*.pc' -o -path '*/include/*' -o -path '*/objects-*' -o -path '*/cache_keys/*' -o -path '*/patches/*' -o -path '*/nv-codec-headers/*' -o -path '*/tdesktop_rust/out/*' ')' -type f ')' -o -empty ')' -delete

      - name: Noros build (Release, no autoupdate).
        id: build
        if: steps.libs.outcome == 'success'
        continue-on-error: true
        run: |
          cd %TBUILD%\%REPO_NAME%\Telegram
          call configure.bat x64 ^
          -D TDESKTOP_API_ID=${{ secrets.TDESKTOP_API_ID }} ^
          -D TDESKTOP_API_HASH=${{ secrets.TDESKTOP_API_HASH }} ^
          -D CMAKE_CONFIGURATION_TYPES=Release ^
          -D DESKTOP_APP_DISABLE_AUTOUPDATE=ON ^
          -D DESKTOP_APP_DISABLE_CRASH_REPORTS=ON > %GITHUB_WORKSPACE%\build.log 2>&1
          if errorlevel 1 exit /b 1
          cmake --build ..\out --config Release --parallel >> %GITHUB_WORKSPACE%\build.log 2>&1
          if errorlevel 1 exit /b 1

      - name: Report build errors (annotations).
        if: steps.build.outcome == 'failure'
        shell: bash
        run: |
          LOG="$GITHUB_WORKSPACE/build.log"
          echo "log lines: $(wc -l < "$LOG")"
          # Keep API keys out of annotations.
          grep -n -i -E "error|fatal|failed|cannot|unresolved|CMake Error" "$LOG" | sed -E 's/(TDESKTOP_API_(ID|HASH))=[^ ]*/\1=***/g' | head -25 | while IFS= read -r line; do
            echo "::error title=build::${line:0:900}"
          done
          echo "::error title=tail::$(tail -n 12 "$LOG" | sed -E 's/(TDESKTOP_API_(ID|HASH))=[^ ]*/\1=***/g' | head -c 1800 | tr '\n' '|')"

      - name: Package portable.
        if: steps.build.outcome == 'success'
        run: |
          set OUT=%TBUILD%\%REPO_NAME%\out\Release
          mkdir Noros-portable\tdata
          copy %OUT%\Telegram.exe Noros-portable\Noros.exe

      - uses: actions/upload-artifact@v4
        name: Upload Noros-portable.
        if: steps.build.outcome == 'success'
        with:
          name: Noros-portable-x64
          path: Noros-portable\
          retention-days: 30
