name: Build Noros portable (Windows x64)

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: noros-build
  cancel-in-progress: true

env:
  # Upstream Telegram Desktop commit that noros.patch was written against.
  UPSTREAM_REF: f985723b552b30fe1c17d377d57f44e61a15a8c4
  PREPARE_PATH: "Telegram/build/prepare/prepare.py"

jobs:
  windows:
    name: Windows x64 (portable exe)
    runs-on: windows-latest
    timeout-minutes: 350
    defaults:
      run:
        shell: cmd

    steps:
      - name: Check API credentials.
        shell: bash
        run: |
          if [ -z "${{ secrets.TDESKTOP_API_ID }}" ] || [ -z "${{ secrets.TDESKTOP_API_HASH }}" ]; then
            echo "Add repository secrets TDESKTOP_API_ID and TDESKTOP_API_HASH (from https://my.telegram.org/apps)."
            exit 1
          fi

      - name: Free disk space (Release Qt is huge).
        shell: pwsh
        run: |
          $before = [math]::Round((Get-PSDrive C).Free/1GB,1)
          $paths = @('C:\Android','C:\Program Files (x86)\Android','C:\Program Files\Android',
            'C:\Program Files\Microsoft SQL Server','C:\Program Files (x86)\Microsoft SDKs\Azure',
            'C:\Program Files\MongoDB','C:\Program Files\PostgreSQL','C:\Program Files\Google',
            'C:\Program Files (x86)\Google','C:\Program Files\LLVM','C:\Strawberry','C:\Julia',
            'C:\ghcup','C:\msys64','C:\Miniconda','C:\selenium','C:\Rust',
            'C:\hostedtoolcache\windows\Java_Temurin-Hotspot_jdk','C:\hostedtoolcache\windows\go',
            'C:\Program Files\Microsoft Visual Studio\2022','C:\Program Files (x86)\Microsoft Visual Studio\2019',
            'C:\hostedtoolcache\windows\Ruby','C:\hostedtoolcache\windows\PyPy','C:\hostedtoolcache\windows\CodeQL')
          foreach ($p in $paths) { if (Test-Path $p) { Remove-Item $p -Recurse -Force -ErrorAction SilentlyContinue } }
          $after = [math]::Round((Get-PSDrive C).Free/1GB,1)
          Write-Output "::notice title=disk::C: free before $before GB, after $after GB"

      - name: Prepare directories.
        run: |
          mkdir %userprofile%\TBuild\Libraries
          mklink /d %GITHUB_WORKSPACE%\TBuild %userprofile%\TBuild
          echo TBUILD=%GITHUB_WORKSPACE%\TBuild>>%GITHUB_ENV%
          echo LibrariesPath=%GITHUB_WORKSPACE%\TBuild\Libraries\win64>>%GITHUB_ENV%
          echo REPO_NAME=tdesktop>>%GITHUB_ENV%

      - name: Clone upstream Telegram Desktop.
        uses: actions/checkout@v4
        with:
          repository: telegramdesktop/tdesktop
          ref: ${{ env.UPSTREAM_REF }}
          submodules: recursive
          path: ${{ env.TBUILD }}\tdesktop

      - name: Clone fork files.
        uses: actions/checkout@v4
        with:
          path: fork

      - name: Apply Noros patch and overlay.
        shell: bash
        run: |
          cd "$TBUILD/tdesktop"
          git apply --whitespace=nowarn "$GITHUB_WORKSPACE/fork/noros.patch"
          cp -rv "$GITHUB_WORKSPACE/fork/overlay/." .
          test -f Telegram/SourceFiles/noros/noros_brand.cpp
          test -f Telegram/Resources/noros/themes/riopay_glass.tdesktop-theme
          # dump_syms (debug-symbol tool) needs ATL for a newer toolset than the pinned one and is not needed here.
          python3 - <<'PY'
          import re
          p = 'Telegram/build/prepare/prepare.py'
          s = open(p, encoding='utf8').read()
          lines = s.split('\n')
          drop = [l for l in lines if re.search(r'tools\\\\windows\\\\dump_syms|gyp dump_syms\.gyp|msbuild -m dump_syms\.vcxproj', l)]
          print('dropping', len(drop), 'dump_syms lines')
          assert len(drop) == 3, drop
          open(p, 'w', encoding='utf8', newline='').write('\n'.join(l for l in lines if l not in drop))
          PY

      - name: First set up.
        shell: bash
        run: |
          DOCPATH=$TBUILD/$REPO_NAME/docs/building-win.md
          SDK="$(grep "SDK version" $DOCPATH | sed -r 's/.*\*\*(.*)\*\* SDK version.*/\1/')"
          echo "SDK=$SDK" >> $GITHUB_ENV
          sed -i '/CMAKE_${lang}_FLAGS_DEBUG_INIT/s/${_Zi}//' "$PROGRAMFILES"/CMake/share/cmake*/Modules/Platform/Windows-MSVC.cmake
          echo "$(sha256sum $TBUILD/$REPO_NAME/$PREPARE_PATH | awk '{ print $1 }')" >> CACHE_KEY.txt
          echo "$SDK" >> CACHE_KEY.txt
          echo "CACHE_KEY=$(sha256sum CACHE_KEY.txt | awk '{ print $1 }')" >> $GITHUB_ENV
          git config --global user.email "you@example.com"
          git config --global user.name "Sample"

      - uses: Eden-CI/msvc-dev-cmd@master
        name: Native Tools Command Prompt.
        with:
          arch: x64
          sdk: ${{ env.SDK }}
          toolset: "14.44"

      - name: NuGet sources.
        run: |
          nuget sources Disable -Name "Microsoft Visual Studio Offline Packages"
          nuget sources Add -Source https://api.nuget.org/v3/index.json & exit 0

      - name: ThirdParty cache.
        uses: actions/cache@v4
        with:
          path: ${{ env.TBUILD }}\ThirdParty
          key: ${{ runner.OS }}-x64-third-party-${{ env.CACHE_KEY }}
          restore-keys: ${{ runner.OS }}-x64-third-party-

      - name: Libraries cache.
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.LibrariesPath }}\*
            !${{ env.LibrariesPath }}\cache_keys
            !${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\*
            !${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: ${{ runner.OS }}-x64-libs-v3-${{ env.CACHE_KEY }}
          restore-keys: |
            ${{ runner.OS }}-x64-libs-v3-
            ${{ runner.OS }}-x64-libs-v2-

      - name: Qt cache.
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: ${{ runner.OS }}-x64-qt-v3-${{ env.CACHE_KEY }}
          restore-keys: |
            ${{ runner.OS }}-x64-qt-v3-
            ${{ runner.OS }}-x64-qt-

      - name: Libraries.
        id: libs
        continue-on-error: true
        run: |
          %TBUILD%\%REPO_NAME%\Telegram\build\prepare\win.bat silent > %GITHUB_WORKSPACE%\libs.log 2>&1
          if errorlevel 1 exit /b 1

      - name: Report library errors (annotations).
        if: steps.libs.outcome == 'failure'
        shell: bash
        run: |
          LOG="$GITHUB_WORKSPACE/libs.log"
          echo "log lines: $(wc -l < "$LOG")"
          echo "::error title=libs-tail::$(tail -n 30 "$LOG" | cut -c1-220 | head -c 3500 | tr '\n' '|')"
          echo "::error title=libs-errors::$(grep -n -E "error C[0-9]+|fatal error|FAILED:|CMake Error|Error:|exit code|ninja: build stopped|No space left|is not recognized|ModuleNotFound|Traceback" "$LOG" | grep -v "Structured output" | tail -n 8 | cut -c1-300 | head -c 3500 | tr '\n' '|')"

      - name: Free up some disk space.
        if: steps.libs.outcome == 'success'
        shell: bash
        run: find $LibrariesPath '(' '(' ! '(' -name '*.lib' -o -name '*.a' -o -name '*.exe' -o -name '*.h' -o -name '*.hpp' -o -name '*.inc' -o -name '*.cmake' -o -name '*.pc' -o -path '*/include/*' -o -path '*/objects-*' -o -path '*/cache_keys/*' -o -path '*/patches/*' -o -path '*/nv-codec-headers/*' -o -path '*/tdesktop_rust/out/*' ')' -type f ')' -o -empty ')' -delete

      - name: Free Qt build trees and report free space.
        if: steps.libs.outcome == 'success'
        shell: pwsh
        run: |
          $b = [math]::Round((Get-PSDrive C).Free/1GB,1)
          Get-ChildItem $env:LibrariesPath -Directory -ErrorAction SilentlyContinue | Where-Object { $_.Name -match '^qt_' } | ForEach-Object { Remove-Item $_.FullName -Recurse -Force -ErrorAction SilentlyContinue }
          $a = [math]::Round((Get-PSDrive C).Free/1GB,1)
          Write-Output "::notice title=disk-before-build::C: free $b GB -> $a GB after removing Qt build trees"

      - name: Noros build (Release, no autoupdate).
        id: build
        if: steps.libs.outcome == 'success'
        continue-on-error: true
        run: |
          cd %TBUILD%\%REPO_NAME%\Telegram
          call configure.bat x64 ^
          -D TDESKTOP_API_ID=${{ secrets.TDESKTOP_API_ID }} ^
          -D TDESKTOP_API_HASH=${{ secrets.TDESKTOP_API_HASH }} ^
          -D CMAKE_CONFIGURATION_TYPES=Release ^
          -D DESKTOP_APP_DISABLE_AUTOUPDATE=ON ^
          -D DESKTOP_APP_DISABLE_CRASH_REPORTS=ON > %GITHUB_WORKSPACE%\build.log 2>&1
          if errorlevel 1 exit /b 1
          python %GITHUB_WORKSPACE%\nopch.py ..\out\Telegram\Telegram.vcxproj
          if errorlevel 1 exit /b 1
          cmake --build ..\out --config Release --parallel 2 -- /p:CL_MPCount=2 >> %GITHUB_WORKSPACE%\build.log 2>&1
          if not errorlevel 1 exit /b 0
          echo ===== RETRY SERIAL ===== >> %GITHUB_WORKSPACE%\build.log
          cmake --build ..\out --config Release --parallel 1 -- /p:CL_MPCount=1 >> %GITHUB_WORKSPACE%\build.log 2>&1
          if errorlevel 1 exit /b 1

      - name: Report build errors (annotations).
        if: steps.build.outcome == 'failure'
        shell: bash
        run: |
          set +e +o pipefail
          LOG="$GITHUB_WORKSPACE/build.log"
          echo "log lines: $(wc -l < "$LOG")"
          MASK='s/(TDESKTOP_API_(ID|HASH))=[^ ]*/\1=***/g'
          # Real compiler/linker errors only (no warnings, no CMake probe noise), last ones win.
          grep -n -E ": (fatal )?error [A-Z]+[0-9]+|error LNK[0-9]+|FAILED:|CMake Error|MSBUILD : error|Build FAILED|: error:" "$LOG" | grep -v -E "LNK4099|warning|smartglocal_error|stripe_error|HAVE_|Performing Test" | sed -E "$MASK" | tail -n 12 | cut -c1-420 > /tmp/errs.txt
          echo "::error title=build-errors::$(head -c 3800 /tmp/errs.txt | tr '\n' '|')"
          echo "::error title=build-tail::$(tail -n 20 "$LOG" | sed -E "$MASK" | cut -c1-260 | head -c 3500 | tr '\n' '|')"
          exit 0

      - name: Package portable.
        if: steps.build.outcome == 'success'
        run: |
          set OUT=%TBUILD%\%REPO_NAME%\out\Release
          mkdir Noros-portable\tdata
          copy %OUT%\Telegram.exe Noros-portable\Noros.exe

      - uses: actions/upload-artifact@v4
        name: Upload Noros-portable.
        if: steps.build.outcome == 'success'
        with:
          name: Noros-portable-x64
          path: Noros-portable\
          retention-days: 30
